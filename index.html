<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SocialPulse - Social Media Hours Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-8">

  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="text-center space-y-2">
      <h1 class="text-3xl font-extrabold tracking-tight text-white flex items-center justify-center gap-3">
        <i class="fa-solid fa-clock text-indigo-500"></i> Social Media Tracker
      </h1>
      <p class="text-xs text-slate-400">Classroom Live Stats &bull; Hours Spent Yesterday</p>
    </header>

    <!-- Submission Form -->
    <div class="glass-panel rounded-2xl p-6 border border-slate-800 shadow-xl max-w-lg mx-auto">
      <h2 class="text-base font-bold text-white mb-4 flex items-center gap-2">
        <i class="fa-solid fa-paper-plane text-indigo-400"></i> Submit Your Hours
      </h2>
      <form id="pollForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Your Name</label>
          <input type="text" id="studentName" required placeholder="e.g., Alex" 
            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Hours Used Social Media Yesterday</label>
          <input type="number" id="socialHours" min="0" max="24" step="0.5" required placeholder="e.g., 3.5" 
            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors">
        </div>
        <button type="submit" 
          class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold shadow-lg shadow-indigo-600/30 transition-all">
          Submit Response
        </button>
      </form>
    </div>

    <!-- Analytics Dashboard -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <!-- Average Hours -->
      <div class="glass-panel p-5 rounded-2xl border border-slate-800 text-center space-y-1">
        <p class="text-xs text-slate-400 font-medium">Class Average</p>
        <p id="avgDisplay" class="text-3xl font-black text-indigo-400">0.0 <span class="text-sm font-normal text-slate-400">hrs</span></p>
      </div>
      
      <!-- Highest Usage -->
      <div class="glass-panel p-5 rounded-2xl border border-slate-800 text-center space-y-1">
        <p class="text-xs text-slate-400 font-medium">Highest Usage</p>
        <p id="highestHoursDisplay" class="text-2xl font-black text-emerald-400">0 <span class="text-sm font-normal text-slate-400">hrs</span></p>
        <p id="highestNameDisplay" class="text-xs text-slate-300 font-semibold truncate">--</p>
      </div>

      <!-- Lowest Usage -->
      <div class="glass-panel p-5 rounded-2xl border border-slate-800 text-center space-y-1">
        <p class="text-xs text-slate-400 font-medium">Lowest Usage</p>
        <p id="lowestHoursDisplay" class="text-2xl font-black text-rose-400">0 <span class="text-sm font-normal text-slate-400">hrs</span></p>
        <p id="lowestNameDisplay" class="text-xs text-slate-300 font-semibold truncate">--</p>
      </div>
    </div>

    <!-- Live Responses List -->
    <div class="glass-panel rounded-2xl p-6 border border-slate-800 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-base font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-list-check text-indigo-400"></i> Live Responses (<span id="totalCount">0</span>)
        </h3>
        <button onclick="openResetModal()" class="text-xs text-rose-400 hover:text-rose-300 font-medium flex items-center gap-1.5 transition-colors">
          <i class="fa-solid fa-trash-can"></i> Clear All Responses
        </button>
      </div>

      <div id="responsesContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
        <!-- Submissions will render here dynamically -->
      </div>
    </div>

  </div>

  <!-- Clear Votes Confirmation Modal -->
  <div id="resetModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="glass-panel rounded-2xl p-6 max-w-sm w-full text-center border border-slate-700 shadow-2xl relative space-y-4">
      <div class="h-12 w-12 rounded-xl bg-rose-500/20 text-rose-400 flex items-center justify-center mx-auto text-xl">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <h3 class="text-lg font-bold text-white">Clear All Submissions?</h3>
      <p class="text-xs text-slate-300">This will permanently delete all student responses and reset the class statistics.</p>
      <div class="flex items-center justify-center space-x-3 pt-2">
        <button onclick="closeResetModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 hover:text-white text-xs font-semibold">
          Cancel
        </button>
        <button onclick="confirmResetPoll()" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold">
          Yes, Clear All
        </button>
      </div>
    </div>
  </div>

  <script>
    let pollData = JSON.parse(localStorage.getItem('social_media_hours_data')) || [];

    document.addEventListener('DOMContentLoaded', updateDashboard);

    function handleFormSubmit(event) {
      event.preventDefault();
      const nameInput = document.getElementById('studentName');
      const hoursInput = document.getElementById('socialHours');

      const name = nameInput.value.trim();
      const hours = parseFloat(hoursInput.value);

      if (!name || isNaN(hours)) return;

      pollData.push({ id: Date.now(), name, hours });
      localStorage.setItem('social_media_hours_data', JSON.stringify(pollData));

      nameInput.value = '';
      hoursInput.value = '';
      updateDashboard();
    }

    function updateDashboard() {
      const container = document.getElementById('responsesContainer');
      const totalCount = document.getElementById('totalCount');
      totalCount.textContent = pollData.length;

      if (pollData.length === 0) {
        document.getElementById('avgDisplay').innerHTML = `0.0 <span class="text-sm font-normal text-slate-400">hrs</span>`;
        document.getElementById('highestHoursDisplay').innerHTML = `0 <span class="text-sm font-normal text-slate-400">hrs</span>`;
        document.getElementById('highestNameDisplay').textContent = '--';
        document.getElementById('lowestHoursDisplay').innerHTML = `0 <span class="text-sm font-normal text-slate-400">hrs</span>`;
        document.getElementById('lowestNameDisplay').textContent = '--';
        container.innerHTML = `<p class="text-xs text-slate-500 col-span-full text-center py-4">No student responses submitted yet.</p>`;
        return;
      }

      // Calculations
      const totalHours = pollData.reduce((sum, entry) => sum + entry.hours, 0);
      const avg = (totalHours / pollData.length).toFixed(1);

      const maxHours = Math.max(...pollData.map(e => e.hours));
      const minHours = Math.min(...pollData.map(e => e.hours));

      const highestStudents = pollData.filter(e => e.hours === maxHours).map(e => e.name).join(', ');
      const lowestStudents = pollData.filter(e => e.hours === minHours).map(e => e.name).join(', ');

      // Update Top Cards
      document.getElementById('avgDisplay').innerHTML = `${avg} <span class="text-sm font-normal text-slate-400">hrs</span>`;
      document.getElementById('highestHoursDisplay').innerHTML = `${maxHours} <span class="text-sm font-normal text-slate-400">hrs</span>`;
      document.getElementById('highestNameDisplay').textContent = highestStudents;
      document.getElementById('lowestHoursDisplay').innerHTML = `${minHours} <span class="text-sm font-normal text-slate-400">hrs</span>`;
      document.getElementById('lowestNameDisplay').textContent = lowestStudents;

      // Render Responses Cards
      container.innerHTML = pollData.slice().reverse().map(entry => `
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 flex justify-between items-center">
          <span class="font-semibold text-xs text-slate-200 truncate">${escapeHTML(entry.name)}</span>
          <span class="bg-indigo-500/20 text-indigo-300 font-bold text-xs px-2.5 py-1 rounded-lg">
            ${entry.hours} hrs
          </span>
        </div>
      `).join('');
    }

    function openResetModal() {
      document.getElementById('resetModal').classList.remove('hidden');
    }

    function closeResetModal() {
      document.getElementById('resetModal').classList.add('hidden');
    }

    function confirmResetPoll() {
      pollData = [];
      localStorage.removeItem('social_media_hours_data');
      closeResetModal();
      updateDashboard();
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
